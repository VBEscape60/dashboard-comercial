name: Coletar dados do RD

on:
  schedule:
    # A cada 30 minutos, das 8h as 20h (Brasilia = UTC-3). Fora disso o painel nao e usado
    # e cada execucao consome minutos de Actions (repositorio privado).
    - cron: '*/30 11-22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

# Evita que duas coletas escrevam o dados.json ao mesmo tempo.
concurrency:
  group: coletar-rd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coletar negocios do RD Station e faturado do SGF
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
          # Faturado = notas ★ FC do SGF. Sem este secret, o faturado publicado e mantido.
          SGF_INTEGRACAO_TOKEN: ${{ secrets.SGF_INTEGRACAO_TOKEN }}
          SGF_API_URL: https://financeiro.portale60.com.br
        run: node scripts/coletar-rd.js dados.json dados.raw.json

      # O dados.json publicado precisa sair ja saneado: o workflow
      # "Sanear dados publicados" ignora commits do github-actions[bot].
      - name: Sanear para publicacao
        run: |
          node scripts/sanitize-dashboard-data.js dados.raw.json dados.safe.json
          mv dados.safe.json dados.json
          rm -f dados.raw.json

      - name: Publicar se houve mudanca
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # So o updated_at de topo mudou? Nao publica (evita commit + build do Pages a toa).
          # Heartbeat: publica mesmo assim se o ultimo commit do arquivo tiver mais de 3 horas.
          if git show HEAD:dados.json > dados.antigo.json 2>/dev/null; then
            IGUAL=$(node -e "const f=p=>{const d=JSON.parse(require('fs').readFileSync(p,'utf8'));delete d.updated_at;return JSON.stringify(d)};console.log(f('dados.antigo.json')===f('dados.json')?'sim':'nao')")
            IDADE=$(( $(date +%s) - $(git log -1 --format=%ct -- dados.json) ))
            rm -f dados.antigo.json
            if [ "$IGUAL" = "sim" ] && [ "$IDADE" -lt 10800 ]; then
              echo "Dados identicos (ultimo commit ha ${IDADE}s); nada a publicar."
              git checkout -- dados.json
              exit 0
            fi
          fi
          git add dados.json
          git diff --cached --quiet && echo "Sem alteracoes no dados.json" && exit 0
          git commit -m "Atualizando dados dashboard"
          for tentativa in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejeitado por atualizacao concorrente; rebase ($tentativa/5)..."
            git pull --rebase origin main
          done
          echo "Nao foi possivel publicar o dados.json apos varias tentativas."
          exit 1
