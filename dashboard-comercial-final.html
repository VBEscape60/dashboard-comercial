<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard Comercial — Escape Sessenta</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0b;--bg-card:#101312;--bg-card2:#151817;
  --border:rgba(255,255,255,0.06);--border-hi:rgba(255,255,255,0.12);
  --white:#edf0ee;--muted:#6b7a72;
  --green:#22c55e;--green-dim:rgba(34,197,94,0.1);--green-b:rgba(34,197,94,0.3);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.1);--blue-b:rgba(59,130,246,0.3);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.1);--red-b:rgba(239,68,68,0.3);
  --yellow:#eab308;
  --font-d:'Bebas Neue',sans-serif;--font-b:'DM Sans',sans-serif;
  --r:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100vw;height:100vh;overflow:hidden;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 40% at 5% 0%,rgba(34,197,94,0.04) 0%,transparent 50%),
    radial-gradient(ellipse 50% 30% at 95% 100%,rgba(59,130,246,0.04) 0%,transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.01) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,0.01) 40px);
  font-family:var(--font-b);color:var(--white);font-size:17px;
}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:38px;background:rgba(8,10,9,0.97);border-bottom:1px solid var(--border);flex-shrink:0;}
.tb-left{display:flex;align-items:center;gap:8px;}
.tb-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--green),#16a34a);border-radius:6px;display:grid;place-items:center;font-family:var(--font-d);font-size:16px;color:#fff;}
.tb-title{font-family:var(--font-d);font-size:21px;letter-spacing:0.1em;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-mes{padding:4px 14px;border-radius:20px;background:var(--blue-dim);border:1px solid var(--blue-b);color:var(--blue);font-size:16px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;}
.tb-upd{font-size:14px;color:var(--muted);}

/* ── GRID PRINCIPAL ──
   3 linhas:
   A) KPIs        — altura fixa 72px
   B) Meio        — donut + barras acumulado
   C) Baixo       — tabela + tipos + ranking
*/
.layout{
  display:grid;
  grid-template-rows:72px 1fr 1fr;
  height:calc(100vh - 38px);
  padding:6px;
  gap:6px;
}

/* ── ROW A: 5 KPIs ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px 7px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;}
.kpi.g::after{background:linear-gradient(90deg,var(--green),transparent);}
.kpi.b::after{background:linear-gradient(90deg,var(--blue),transparent);}
.kpi.r::after{background:linear-gradient(90deg,var(--red),transparent);}
.kpi.y::after{background:linear-gradient(90deg,var(--yellow),transparent);}
.kpi-lbl{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:2px;}
.kpi-val{font-family:var(--font-d);font-size:42px;line-height:1;}
.kpi.g .kpi-val{color:var(--green);}
.kpi.b .kpi-val{color:var(--blue);}
.kpi.r .kpi-val{color:var(--red);}
.kpi.y .kpi-val{color:var(--yellow);}
.kpi-sub{font-size:13px;color:var(--muted);margin-top:2px;}

/* ── ROW B: donut 190px | barras restante ── */
.mid-row{display:grid;grid-template-columns:190px 1fr;gap:6px;min-height:0;}

/* ── ROW C: tabela | tipo-mes | tipo-ano | ranking ── */
.bot-row{display:grid;grid-template-columns:0.92fr 0.45fr 0.45fr 380px;gap:6px;min-height:0;}

/* ── CARD BASE ── */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.card-ttl{font-family:var(--font-d);font-size:17px;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.card-ttl::before{content:'';width:2px;height:12px;border-radius:2px;background:var(--green);flex-shrink:0;}

/* ── DONUT ── */
.donut-mes{font-family:var(--font-d);font-size:18px;color:var(--blue);text-align:center;margin-bottom:5px;letter-spacing:0.06em;flex-shrink:0;}
.donut-wrap{position:relative;width:120px;height:120px;margin:0 auto 8px;flex-shrink:0;}
.donut-ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-pct{font-family:var(--font-d);font-size:29px;color:var(--white);line-height:1;}
.donut-sub{font-size:13px;color:var(--muted);}
.legend{list-style:none;display:flex;flex-direction:column;gap:5px;}
.legend li{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.leg-val{margin-left:auto;font-weight:600;font-size:16px;}

/* ── ACUMULADO ── */
.acum-top{display:flex;gap:20px;flex-wrap:nowrap;margin-bottom:6px;flex-shrink:0;}
.acum-s-lbl{font-size:13px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:1px;}
.acum-s-val{font-family:var(--font-d);font-size:31px;}
.acum-s-val.g{color:var(--green);}
.acum-s-val.r{color:var(--red);}
.acum-s-val.w{color:var(--white);}
