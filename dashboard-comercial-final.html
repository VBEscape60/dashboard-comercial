<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial Escape60</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111f;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    padding:12px;
}

.dashboard{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.titulo{
    font-size:34px;
    font-weight:900;
}

.atualizacao{
    font-size:15px;
    opacity:.7;
}

.cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.card{
    background:rgba(255,255,255,.06);
    border-radius:18px;
    padding:16px;
    border:1px solid rgba(255,255,255,.08);
}

.card-label{
    font-size:14px;
    opacity:.75;
    margin-bottom:8px;
}

.card-valor{
    font-size:32px;
    font-weight:900;
}

.conteudo{
    flex:1;
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:12px;
    min-height:0;
}

.box{
    background:rgba(255,255,255,.06);
    border-radius:18px;
    padding:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
}

.box h2{
    font-size:18px;
    margin-bottom:10px;
}

.grafico-wrap{
    position:relative;
    width:100%;
    height:calc(100% - 30px);
}

canvas{
    width:100% !important;
    height:100% !important;
}

.tabela{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

.tabela th{
    text-align:left;
    padding:6px;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.tabela td{
    padding:6px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.status-fechado{
    color:#59ff9a;
    font-weight:700;
}

.status-negociacao{
    color:#ffd166;
    font-weight:700;
}

.status-recusado{
    color:#ff6b6b;
    font-weight:700;
}

.ranking-item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

#alertaVenda{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.88);
    z-index:99999;
}

.alerta-box{
    width:75vw;
    height:65vh;
    background:linear-gradient(135deg,#00458a,#07111f);
    border-radius:30px;
    border:3px solid rgba(255,255,255,.15);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.alerta-titulo{
    font-size:70px;
    font-weight:900;
    margin-bottom:30px;
}

.alerta-texto{
    font-size:34px;
    line-height:1.4;
    font-weight:700;
}

.btnSom{
    position:fixed;
    bottom:15px;
    right:15px;
    z-index:999999;
    border:none;
    border-radius:10px;
    background:#ffffff20;
    color:#fff;
    padding:10px 14px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="alertaVenda">
    <div class="alerta-box">
        <div class="alerta-titulo">
            VENDA FECHADA
        </div>

        <div id="textoAlerta" class="alerta-texto"></div>
    </div>
</div>

<button class="btnSom" onclick="ativarSom()">
    Ativar Som
</button>

<div class="dashboard">

    <div class="topo">
        <div class="titulo">
            DASHBOARD COMERCIAL
        </div>

        <div id="ultimaAtualizacao" class="atualizacao">
            Atualizando...
        </div>
    </div>

    <div class="cards">

        <div class="card">
            <div class="card-label">% Meta Mínima</div>
            <div id="cardMinima" class="card-valor">0%</div>
        </div>

        <div class="card">
            <div class="card-label">% Meta Desejável</div>
            <div id="cardDesejavel" class="card-valor">0%</div>
        </div>

        <div class="card">
            <div class="card-label">Falta Mínima</div>
            <div id="cardFaltaMinima" class="card-valor">R$0</div>
        </div>

        <div class="card">
            <div class="card-label">Falta Desejável</div>
            <div id="cardFaltaDesejavel" class="card-valor">R$0</div>
        </div>

        <div class="card">
            <div class="card-label">Vendas Fechadas</div>
            <div id="cardVendasMes" class="card-valor">0</div>
        </div>

    </div>

    <div class="conteudo">

        <div class="box">
            <h2>Meta Desejável</h2>
            <div class="grafico-wrap">
                <canvas id="graficoMeta"></canvas>
            </div>
        </div>

        <div class="box">
            <h2>Projetos do Mês</h2>
            <div class="grafico-wrap">
                <canvas id="graficoTipoMes"></canvas>
            </div>
        </div>

        <div class="box">
            <h2>Projetos do Ano</h2>
            <div class="grafico-wrap">
                <canvas id="graficoTipoAno"></canvas>
            </div>
        </div>

        <div class="box">
            <h2>Últimas Negociações</h2>

            <table class="tabela">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Vendedor</th>
                        <th>Cliente</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="tabelaVendas"></tbody>
            </table>
        </div>

        <div class="box">
            <h2>Acumulado</h2>
            <div class="grafico-wrap">
                <canvas id="graficoAcumulado"></canvas>
            </div>
        </div>

        <div class="box">
            <h2>Ranking</h2>

            <div id="ranking"></div>
        </div>

    </div>

</div>

<script>

const URL_DADOS = "dados.json";

let graficoMeta = null;
let graficoTipoMes = null;
let graficoTipoAno = null;
let graficoAcumulado = null;

let primeiraCargaAlertas = true;
let ultimaChaveAlertada = null;

let somLiberado = false;

function ativarSom(){
    somLiberado = true;
}

function tocarSom(){

    if(!somLiberado) return;

    try{

        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.15);

        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.8);

    }catch(e){
        console.log(e);
    }
}

function numero(valor){

    return Number(
        String(valor || 0)
        .replace("R$","")
        .replace(/\./g,"")
        .replace(",",".")
    ) || 0;
}

function moeda(valor){

    return numero(valor).toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL",
        maximumFractionDigits:0
    });
}

function percentual(valor){

    if(!isFinite(valor)) return "0%";

    return Math.round(valor) + "%";
}

function converterData(data){

    if(!data) return new Date(0);

    const texto = String(data);

    if(texto.includes(" ") && !texto.includes("T")){
        return new Date(texto.replace(" ","T"));
    }

    return new Date(texto);
}

function gerarChaveVenda(venda){

    return [
        venda.Reserva || "",
        venda.Cliente || "",
        venda.Vendedor || "",
        venda.Valor || "",
        venda.DataVenda || "",
        venda.Status || ""
    ].join("|");
}

function verificarAlertaVendaFechada(vendas){

    const fechadas = vendas
    .filter(v => String(v.Status || "").trim().toLowerCase() === "fechado")
    .sort((a,b)=> converterData(b.DataVenda) - converterData(a.DataVenda));

    if(fechadas.length === 0) return;

    const ultimaVenda = fechadas[0];

    const chaveAtual = gerarChaveVenda(ultimaVenda);

    if(primeiraCargaAlertas){

        ultimaChaveAlertada = chaveAtual;
        primeiraCargaAlertas = false;
        return;
    }

    if(chaveAtual !== ultimaChaveAlertada){

        ultimaChaveAlertada = chaveAtual;

        dispararAlerta(ultimaVenda);
    }
}

function dispararAlerta(venda){

    const alerta = document.getElementById("alertaVenda");
    const texto = document.getElementById("textoAlerta");

    texto.innerHTML = `
        ${venda.Vendedor || ""}<br>
        ${venda.Cliente || ""}<br>
        ${moeda(venda.Valor || 0)}
    `;

    alerta.style.display = "flex";

    tocarSom();

    setTimeout(()=>{

        alerta.style.display = "none";

    },3000);
}

async function atualizarDashboard(){

    try{

        const resposta = await fetch(`${URL_DADOS}?v=${Date.now()}`,{
            cache:"no-store"
        });

        const dados = await resposta.json();

        const vendas = dados.vendas || [];
        const metas = dados.metas || [];

        // ALERTA - APENAS 1 CHAMADA
        verificarAlertaVendaFechada(vendas);

        document.getElementById("ultimaAtualizacao").innerHTML =
        "Atualizado em " + new Date().toLocaleTimeString("pt-BR");

    }catch(e){

        console.log(e);

        document.getElementById("ultimaAtualizacao").innerHTML =
        "Erro ao atualizar";
    }
}

// APENAS 1 CHAMADA
atualizarDashboard();

// APENAS 1 INTERVAL
setInterval(atualizarDashboard,60000);

</script>

</body>
</html>
